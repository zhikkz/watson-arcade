<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d18">
  <meta name="description" content="Watson 的像素游戏大厅。选择你喜欢的游戏，无需下载，点击即玩。">
  <title>实验室街机厅 · Watson Arcade</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="./assets/arcade-pixel.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./assets/lobby.css">
  <script src="./assets/lobby.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#games">跳到游戏选择</a>
  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="./" aria-label="Watson Arcade 游戏大厅">
        <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true" shape-rendering="crispEdges"><path d="M7 2h10v3h-2v5l5 8v4H4v-4l5-8V5H7z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 16h10v4H7zM10 12h3v2h-3z" fill="currentColor"/></svg>
        <span>WATSON<span class="brand-light"> ARCADE</span></span>
      </a>
      <span class="header-status"><i aria-hidden="true"></i> 实验室已开放</span>
    </header>

    <main>
      <section class="welcome" aria-labelledby="page-title">
        <div class="welcome-copy">
          <p class="eyebrow"><span aria-hidden="true">+</span> WELCOME TO THE LAB <span class="eyebrow-tail" aria-hidden="true">────────</span></p>
          <h1 id="page-title">实验室<span>街机厅</span><b class="title-cursor" aria-hidden="true">_</b></h1>
          <p class="intro">像素世界，随时开局。<br class="mobile-break">选一场冒险，即刻开局。</p>
        </div>
        <div class="lab-stamp" aria-hidden="true"><span>PLAYER</span><strong>01</strong><span>READY TO PLAY</span><div class="stamp-bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
      </section>

      <section class="game-selection" id="games" aria-labelledby="selection-title">
        <div class="section-heading"><h2 id="selection-title"><span class="section-cross" aria-hidden="true">✦</span> 选择你的游戏 <span class="section-english">/ SELECT GAME</span></h2><span class="game-count">{{GAME_COUNT}} GAMES</span></div>
        <div class="game-grid">
{{GAME_CARDS}}
        </div>
      </section>

      <div class="play-notes"><p><svg viewBox="0 0 20 16" aria-hidden="true" shape-rendering="crispEdges"><path d="M4 2h12v2h2v10h-4v-3H6v3H2V4h2zM6 5v5M3.5 7.5h5M12 6h2M15 9h2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg> 无需下载 · 点击即玩 <span class="note-divider">/</span> 支持键盘与触屏</p><p class="keyboard-note"><kbd>←</kbd><kbd>→</kbd> 选择 <kbd>Enter</kbd> 进入</p></div>
    </main>

    <footer class="site-footer"><span>WATSONWOWOSEN.COM</span><span class="footer-message">像素世界，随时开局。<span aria-hidden="true"> ✦</span></span><span class="footer-credit">MADE FOR PLAY<span aria-hidden="true"> ■ ■ ■</span></span></footer>
  </div>
</body>
</html>
