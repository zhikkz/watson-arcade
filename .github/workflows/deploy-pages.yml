name: Build and deploy Watson Arcade

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build all registered games and the lobby
        run: python scripts/build.py --install
      - name: Test game registration and static packaging
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test Collapse Lab navigation and save regressions
        run: npm test --prefix games/collapse-lab
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Test navigation, saves and touch controls
        run: |
          python games/zhenge-run/tests/browser_smoke.py
          python tests/lobby_smoke.py
      - name: Test Collapse Lab on phones and tablets
        run: |
          mkdir -p test-results/collapse-lab
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          node games/collapse-lab/tools/test/mobile.mjs test-results/collapse-lab
      - name: Build PR base for the mobile performance comparison
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          baseline_dir="$(mktemp -d)"
          git archive "$BASE_SHA" | tar -x -C "$baseline_dir"
          npm ci --prefix "$baseline_dir/games/collapse-lab" --no-audit --no-fund
          (cd "$baseline_dir/games/collapse-lab" && node tools/build.mjs)
          cp "$baseline_dir/games/collapse-lab/dist/index.html" test-results/collapse-lab-before.html
      - name: Measure mobile frame times with 4x CPU throttling
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          if [ -f test-results/collapse-lab-before.html ]; then
            node games/collapse-lab/tools/test/perf.mjs test-results/collapse-lab-before.html > test-results/collapse-lab/perf-before.json
          fi
          node games/collapse-lab/tools/test/perf.mjs > test-results/collapse-lab/perf-after.json
          node games/collapse-lab/tools/test/perf-report.mjs test-results/collapse-lab >> "$GITHUB_STEP_SUMMARY"
      - name: Keep mobile screenshots and performance measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collapse-lab-mobile-tests
          path: test-results/collapse-lab
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
