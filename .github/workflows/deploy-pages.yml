name: Build and deploy Watson Arcade

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build all registered games and the lobby
        run: python scripts/build.py --install
      - name: Test game registration and static packaging
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test Collapse Lab navigation and save regressions
        run: npm test --prefix games/collapse-lab
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Test navigation, saves and touch controls
        run: |
          python games/zhenge-run/tests/browser_smoke.py
          python tests/lobby_smoke.py
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
