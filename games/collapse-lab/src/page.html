<title>坍缩实验室</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* 布局：单屏游戏，画布铺满可用区域。
     电脑上按整数倍居中放大；触屏设备上画面宽度随屏幕比例伸缩（16:9 ~ 20:9）直接铺满，
     虚拟按键画在游戏画面里。手机竖屏时把整个画面旋转 90°，强制横屏游玩。 */
  :root {
    color-scheme: dark;
    --bg: #07060c;
    --ink: #e8ecf4;
    --cyan: #62e6ff;
    --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* 可用区域：避开刘海 / 圆角 / 底部横条 */
  #root {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    right: env(safe-area-inset-right, 0px);
    bottom: env(safe-area-inset-bottom, 0px);
    left: env(safe-area-inset-left, 0px);
    overflow: hidden;
    touch-action: none;
  }
  /* 逻辑上的横屏画布容器：尺寸与旋转由 main.js 设置 */
  #app { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 0 0; }
  #game {
    position: absolute; left: 0; top: 0; display: block;
    image-rendering: pixelated; image-rendering: crisp-edges;
    background: #000; outline: none; touch-action: none;
  }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 14px; letter-spacing: 0.2em; color: var(--cyan); background: var(--bg); }
  #hall-link { position: absolute; top: 8px; left: 8px; z-index: 2; display: inline-flex; align-items: center; min-height: 32px; padding: 0 12px; border: 1px solid #556285; background: #101322; color: #e8ecf4; font: 13px/1.4 var(--font-mono); text-decoration: none; touch-action: manipulation; }
  #hall-link:hover, #hall-link:focus-visible { color: #62e6ff; border-color: #62e6ff; outline: 2px solid #62e6ff; outline-offset: 3px; }
</style>

<div id="root">
  <div id="app">
    <canvas id="game" width="640" height="360" tabindex="0" aria-label="坍缩实验室 游戏画面"></canvas>
    <a id="hall-link" href="../">← 游戏大厅</a>
    <div id="loading">LOADING…</div>
  </div>
</div>
