<meta name="claude:viewport-fit-sides" content="cover">
<title>震哥快跑</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=ZCOOL+QingKe+HuangYou&display=swap">
<style>
/* Layout: an arcade cabinet on one screen. A letterboxed low-res pixel stage fills the view;
   all UI floats over it in em units tied to stage width. Touch pad docks under the stage
   in portrait and in the bottom corners in landscape. Single dark look by design. */
:root{
  color-scheme:dark;
  --void:#070912; --panel:#0c1224; --line:#2b3a63;
  --ink:#e6f1ff; --dim:#8fa0c8;
  --cyan:#45f0df; --magenta:#ff4fa3; --amber:#ffc857; --danger:#ff4d5e;
  --font-display:"ZCOOL QingKe HuangYou","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  --font-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","WenQuanYi Zen Hei",system-ui,sans-serif;
  --font-pixel:"Silkscreen","Courier New",monospace;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--ink);font-family:var(--font-body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#stage{position:relative;flex:none;overflow:hidden;background:#000;touch-action:none;font-size:10px;
  box-shadow:0 0 0 2px #000,0 0 0 4px var(--line),0 0 60px rgba(69,240,223,.08)}
#game,#fx{position:absolute;inset:0;width:100%;height:100%;display:block}
#game{image-rendering:pixelated;image-rendering:crisp-edges}
#fx,#crt,#flash{pointer-events:none}
#crt{position:absolute;inset:0;background:
  repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.13) 2px 3px),
  radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.5) 100%)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;transition:opacity .5s}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* HUD */
#hud{position:absolute;inset:0 0 auto 0;display:flex;align-items:center;justify-content:space-between;gap:1em;
  padding:.8em 1em;font-family:var(--font-pixel);font-size:max(11px,1.3em);text-shadow:1px 1px 0 #000;pointer-events:none}
#hud .grp{display:flex;align-items:center;gap:.8em;min-width:0}
#batt{display:flex;gap:2px;padding:2px;border:2px solid var(--ink);position:relative}
#batt::after{content:"";position:absolute;right:-5px;top:25%;width:3px;height:50%;background:var(--ink)}
#batt i{display:block;width:.7em;height:.9em;background:var(--cyan)}
#batt i.off{background:transparent}
#batt.low i{background:var(--danger)}
#sec{font-family:var(--font-body);font-weight:700;font-size:max(11px,.95em);color:var(--dim);white-space:nowrap}
#prog{flex:1;max-width:14em;height:4px;background:rgba(255,255,255,.14);position:relative}
#prog b{position:absolute;inset:0 auto 0 0;width:0;background:var(--amber)}
#dist{font-variant-numeric:tabular-nums}
#en{color:var(--amber);font-variant-numeric:tabular-nums}
#hud button{pointer-events:auto;background:rgba(12,18,36,.8);border:2px solid var(--line);width:2.2em;height:2.2em;min-width:28px;min-height:28px;
  padding:0;font-family:var(--font-pixel);font-size:.9em;line-height:1}
#hud button.off{color:var(--dim);text-decoration:line-through}

/* Zhang Zhen speaking */
.face{image-rendering:pixelated;background:#16203c;border:2px solid var(--cyan);flex:none}
#dlg{position:absolute;left:2em;right:2em;top:4.6em;display:flex;gap:1em;align-items:flex-start;
  padding:1em 1.2em;background:rgba(9,13,28,.94);border:2px solid var(--cyan);box-shadow:0 0 0 2px #000,5px 5px 0 rgba(0,0,0,.55)}
#dlg.side{right:27%}
#dlg .face{width:max(44px,5.4em);height:max(44px,5.4em)}
#dlg .body{flex:1;min-width:0}
#dlg b{display:block;font-family:var(--font-display);font-weight:400;font-size:max(13px,1.5em);letter-spacing:.12em;color:var(--cyan);margin-bottom:.2em}
#dlg p{margin:0;font-size:max(13px,1.55em);line-height:1.5;min-height:3em;font-weight:500}
#dlg-hint{display:block;margin-top:.3em;font-size:max(11px,1.15em);color:var(--amber);font-weight:700;animation:blink 1s steps(2) infinite}
#dlg-skip{position:absolute;right:.6em;top:.5em;background:none;border:0;color:var(--dim);font-size:max(11px,1.1em);padding:.3em .5em}
#toast{position:absolute;left:50%;top:4.6em;transform:translate(-50%,-8px);display:flex;gap:.7em;align-items:center;max-width:86%;
  padding:.5em .9em .5em .5em;background:rgba(9,13,28,.9);border:2px solid var(--line);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast .face{width:max(26px,3em);height:max(26px,3em);border-width:1px}
#toast p{margin:0;font-size:max(12px,1.3em);line-height:1.4;font-weight:500}
#banner{position:absolute;left:0;right:0;top:36%;text-align:center;pointer-events:none;opacity:0}
#banner.on{animation:banner 2.4s ease-out both}
#banner strong{display:block;font-family:var(--font-display);font-weight:400;font-size:max(24px,4.4em);letter-spacing:.14em;
  text-shadow:-.04em 0 var(--magenta),.04em 0 var(--cyan),0 4px 0 #000}
#banner span{font-family:var(--font-pixel);font-size:max(10px,1.1em);color:var(--amber);letter-spacing:.2em}
@keyframes banner{0%{opacity:0;transform:scaleX(1.3)}12%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
@keyframes blink{50%{opacity:.25}}

/* Screens */
.scr{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:1.1em;padding:3em 4em;
  background:linear-gradient(90deg,rgba(7,9,18,.9) 0%,rgba(7,9,18,.6) 42%,rgba(7,9,18,0) 72%)}
.scr.full{background:rgba(7,9,18,.82);align-items:center;text-align:center}
.eyebrow{font-family:var(--font-pixel);font-size:max(9px,1.05em);letter-spacing:.22em;color:var(--cyan);margin:0}
.scr h1,.scr h2{margin:0;font-family:var(--font-display);font-weight:400;line-height:.95;letter-spacing:.05em;
  text-shadow:-.035em 0 var(--magenta),.035em 0 var(--cyan),0 .06em 0 #000;text-wrap:balance}
.scr h1{font-size:clamp(38px,8em,150px)}
.scr h2{font-size:clamp(26px,5em,90px)}
.narrow .scr{padding:2em 2.4em;gap:.9em}
.narrow .scr h1{font-size:50px}
.narrow .scr h2{font-size:30px}
.sub{margin:0;font-size:max(13px,1.9em);font-weight:700;letter-spacing:.34em;color:var(--amber)}
.quote{margin:0;font-size:max(12px,1.45em);line-height:1.5;color:var(--ink);max-width:30em}
.btns{display:flex;flex-wrap:wrap;gap:.9em}
.scr.full .btns{justify-content:center}
.btn{background:var(--panel);border:2px solid var(--cyan);padding:.55em 1.1em;font-size:max(13px,1.6em);font-weight:700;letter-spacing:.08em;
  box-shadow:4px 4px 0 #000;transition:transform .08s}
.btn.primary{background:var(--amber);border-color:#fff3c9;color:#1a1204}
.btn.quiet{border-color:var(--line);color:var(--dim);font-size:max(11px,1.15em);font-weight:500;box-shadow:none}
.btn:hover{transform:translate(-1px,-1px)}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}
.keys{max-width:60%;margin:0;font-size:max(10px,1.15em);color:var(--dim);line-height:1.6}
.keys kbd{font-family:var(--font-pixel);font-size:.9em;color:var(--ink);border:1px solid var(--line);padding:0 .4em;background:var(--panel)}
.stats{display:flex;flex-wrap:wrap;justify-content:center;gap:.5em 2.2em;margin:0}
.stats div{display:flex;flex-direction:column;gap:.1em}
.stats dt{font-size:max(10px,1.05em);color:var(--dim)}
.stats dd{margin:0;font-family:var(--font-pixel);font-size:max(14px,2em);color:var(--amber);font-variant-numeric:tabular-nums}

/* Persistent wallet + skin shop */
.wallet{margin:0;color:var(--amber);font-size:max(12px,1.3em);font-variant-numeric:tabular-nums}
#title .wallet span{color:var(--dim);font-size:.9em;margin-left:.6em}
#shop{justify-content:flex-start;gap:.65em;padding:1.5em 2em;overflow:auto;touch-action:pan-y;background:rgba(7,9,18,.96)}
.shop-head{display:flex;align-items:center;justify-content:space-between;gap:1em;width:100%}
#shop h2{font-size:max(24px,3em)}
.shop-info{display:flex;flex-wrap:wrap;justify-content:center;gap:.4em 1.5em}
.shop-info .lifetime{color:var(--dim)}
.skin-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1em;width:100%;max-width:46em}
.skin-card{min-width:0;padding:.5em;border:2px solid var(--line);background:var(--panel)}
.skin-card.equipped{border-color:var(--cyan);box-shadow:0 0 16px rgba(69,240,223,.12)}
.skin-preview{display:block;width:100%;height:7em;object-fit:contain;image-rendering:pixelated;background:radial-gradient(ellipse at bottom,#1d2b48,transparent 75%)}
.skin-card h3{margin:.2em 0;font-family:var(--font-display);font-size:max(16px,1.9em);font-weight:400;color:var(--ink)}
.skin-price{margin:.25em 0 .6em;color:var(--amber);font-size:max(11px,1.1em)}
.skin-card .btn{width:100%;padding:.45em .2em;font-size:max(12px,1.25em);letter-spacing:0;box-shadow:2px 2px 0 #000}
.btn:disabled{cursor:default;opacity:.55;transform:none;box-shadow:none}
.shop-note{margin:0;font-size:max(11px,1.1em);line-height:1.45;color:var(--dim)}
#shop-status{min-height:1.45em;color:var(--cyan)}
#shop-status:empty{display:none}
.narrow #title{gap:.65em;padding:1.3em 2em}
.narrow #shop{padding:1em;gap:.5em}
.narrow .skin-grid{gap:.5em}
.narrow .skin-preview{height:6.5em}

/* Touch pad */
#pad{display:none;gap:14px;width:100%;max-width:520px;flex:none}
.touch #pad{display:flex}
.shopping #pad{visibility:hidden}
#pad button{flex:1;min-height:92px;background:var(--panel);border:2px solid var(--line);box-shadow:4px 4px 0 #000;touch-action:none;
  font-family:var(--font-display);font-size:30px;letter-spacing:.1em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#pad button small{font-family:var(--font-body);font-size:12px;letter-spacing:0;color:var(--dim)}
#pad button.down{transform:translate(2px,2px);box-shadow:2px 2px 0 #000;border-color:var(--cyan)}
#p-jump{border-color:var(--cyan)}
@media (orientation:landscape){
  .touch #pad{position:absolute;left:0;right:0;bottom:0;max-width:none;justify-content:space-between;pointer-events:none;box-sizing:border-box;
    padding:0 max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .touch #pad button{flex:none;width:76px;height:76px;min-height:0;border-radius:50%;opacity:.62;pointer-events:auto;font-size:26px}
  .touch #pad button small{display:none}
}
@media (prefers-reduced-motion:reduce){#dlg-hint{animation:none}#banner.on{animation-duration:2.4s}}
</style>

<div id="app">
  <div id="stage">
    <canvas id="game" width="640" height="360"></canvas>
    <canvas id="fx"></canvas>
    <div id="crt"></div>
    <div id="flash"></div>

    <div id="hud" hidden>
      <div class="grp"><div id="batt" aria-label="电量"><i></i><i></i><i></i></div><span id="sec"></span></div>
      <div id="prog" aria-hidden="true"><b></b></div>
      <div class="grp"><span id="dist">0M</span><span id="en">◆0</span>
        <button id="b-mute" type="button" aria-label="声音开关">♪</button>
        <button id="b-pause" type="button" aria-label="暂停">II</button></div>
    </div>

    <div id="banner"><strong></strong><span></span></div>
    <div id="toast"><canvas class="face" width="30" height="30"></canvas><p></p></div>
    <div id="dlg" hidden>
      <canvas class="face" width="30" height="30"></canvas>
      <div class="body"><b>张震</b><p id="dlg-t"></p><span id="dlg-hint"></span></div>
      <button id="dlg-skip" type="button">跳过 »</button>
    </div>

    <section id="title" class="scr">
      <p class="eyebrow">PHYSICS LAB · B3 → F1</p>
      <h1>震哥快跑</h1>
      <p class="sub">逃离物理实验室</p>
      <p class="wallet">能量子 ◆<b class="wallet-balance">0</b><span id="current-skin">皮肤：张震</span></p>
      <div class="btns">
        <button id="b-start" class="btn primary" type="button">▶ 开始逃亡</button>
        <button id="b-endless" class="btn" type="button">∞ 无尽模式</button>
      </div>
      <p class="keys" id="keys"></p>
      <div class="btns">
        <button id="b-shop" class="btn quiet" type="button">◆ 皮肤商店</button>
        <button id="b-teach" class="btn quiet" type="button"></button>
      </div>
    </section>

    <section id="shop" class="scr full" aria-labelledby="shop-heading" hidden>
      <div class="shop-head"><h2 id="shop-heading">皮肤商店</h2><button id="b-shop-close" class="btn quiet" type="button">返回标题</button></div>
      <div class="shop-info">
        <p class="wallet">可用能量子 ◆<b class="wallet-balance">0</b></p>
        <p class="wallet lifetime">累计收集 ◆<b id="lifetime-energy">0</b></p>
      </div>
      <div class="skin-grid">
        <article class="skin-card" data-skin="zhangzhen">
          <canvas class="skin-preview" width="128" height="107" role="img" aria-label="张震皮肤预览"></canvas>
          <h3>张震</h3><p class="skin-price">初始皮肤 · 免费</p>
          <button class="btn skin-action" type="button" aria-label="张震：使用中">使用中</button>
        </article>
        <article class="skin-card" data-skin="dingjia">
          <canvas class="skin-preview" width="128" height="107" role="img" aria-label="丁甲皮肤预览"></canvas>
          <h3>丁甲</h3><p class="skin-price">◆500 能量子</p>
          <button class="btn skin-action" type="button" aria-label="丁甲：购买并使用">购买并使用</button>
        </article>
        <article class="skin-card" data-skin="woshen">
          <canvas class="skin-preview" width="128" height="107" role="img" aria-label="沃神皮肤预览"></canvas>
          <h3>沃神</h3><p class="skin-price">◆500 能量子</p>
          <button class="btn skin-action" type="button" aria-label="沃神：购买并使用">购买并使用</button>
        </article>
      </div>
      <p id="shop-status" class="shop-note" role="status" aria-live="polite"></p>
      <p class="shop-note">能量子获取后立即入账，失败或重试也保留。</p>
      <p id="save-note" class="shop-note">进度自动保存在当前浏览器，清除网站数据会重置。</p>
    </section>

    <section id="pause" class="scr full" hidden>
      <h2>暂停</h2>
      <div class="btns"><button id="b-resume" class="btn primary" type="button">继续跑</button>
        <button id="b-quit" class="btn" type="button">回到标题</button></div>
    </section>

    <section id="over" class="scr full" hidden>
      <p class="eyebrow">CAUGHT BY MAXWELL</p>
      <h2>被光幕追上了</h2>
      <p class="quote" id="over-q"></p>
      <dl class="stats" id="over-s"></dl>
      <div class="btns"><button id="b-retry" class="btn primary" type="button"></button>
        <button id="b-home" class="btn" type="button">回到标题</button></div>
    </section>

    <section id="win" class="scr full" hidden>
      <p class="eyebrow">ESCAPED · F1</p>
      <h2>逃出实验室！</h2>
      <dl class="stats" id="win-s"></dl>
      <div class="btns"><button id="b-again" class="btn primary" type="button">再逃一次</button>
        <button id="b-win-endless" class="btn" type="button">∞ 无尽模式</button></div>
    </section>
  </div>

  <div id="pad">
    <button id="p-slide" type="button">滑<small>滑铲 / 空中急降</small></button>
    <button id="p-jump" type="button">跳<small>空中再点 = 二段跳</small></button>
  </div>
</div>

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);
const H=360, GY=296, BT=160, BH=H+BT;
const G=1900, VJ=620, VDJ=560, JT=2*VJ/G, VPAD=950;
const CLR=56, BW=.9, BF=.18; /* CLR: lowest overhead clearance, taller than the slide sprite */
let W=640, PX=96, cssScale=1, dpr=1, emPx=10;
const app=$('#app'), stage=$('#stage'), cv=$('#game'), g=cv.getContext('2d'), fxc=$('#fx'), f=fxc.getContext('2d');
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
let touch=matchMedia('(pointer: coarse)').matches;
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};

/* ---------- sprite atlas ---------- */
const SKINS=[
  {id:'zhangzhen',name:'张震',price:0,atlas:new Image(),src:'data:image/png;base64,__ATLAS__'},
  {id:'dingjia',name:'丁甲',price:500,atlas:new Image(),src:'data:image/png;base64,__DINGJIA_ATLAS__'},
  {id:'woshen',name:'沃神',price:500,atlas:new Image(),src:'data:image/png;base64,__WOSHEN_ATLAS__'},
];
const PROGRESS_KEY='zg_progress';
function readProgress(){
  const raw=store.get(PROGRESS_KEY,null),p=raw&&typeof raw==='object'?raw:{};
  const valid=n=>Number.isSafeInteger(n)&&n>=0;
  const balance=valid(p.balance)?p.balance:0,total=valid(p.total)?Math.max(p.total,balance):balance;
  const owned=SKINS.filter(s=>!s.price||(Array.isArray(p.owned)&&p.owned.includes(s.id))).map(s=>s.id);
  return{version:1,balance,total,owned,selected:owned.includes(p.selected)?p.selected:'zhangzhen'};
}
let progress=readProgress(),storageOK=true;
let ATLAS=SKINS.find(s=>s.id===progress.selected).atlas;
const CW=128,CH=107,COLS=8,AX=53;
const JB=[98,98,86,68,61,76,98,98], TB=[75,74,73,74,75,74], IDLE_D=[.19,.2,.2,.1,.18,.2];
function frame(ctx,i,x,y,atlas=ATLAS){ctx.drawImage(atlas,(i%COLS)*CW,(i/COLS|0)*CH,CW,CH,x,y,CW,CH)}

/* ---------- saved energy + skins ---------- */
function renderWallet(){
  for(const el of document.querySelectorAll('.wallet-balance'))el.textContent=progress.balance;
  $('#lifetime-energy').textContent=progress.total;
  $('#current-skin').textContent='皮肤：'+SKINS.find(s=>s.id===progress.selected).name;
  $('#save-note').textContent=storageOK?'进度自动保存在当前浏览器，清除网站数据会重置。':'浏览器未允许保存，当前进度仅在本次打开期间有效。';
}
function useSkin(){ATLAS=SKINS.find(s=>s.id===progress.selected).atlas}
function saveProgress(){storageOK=store.set(PROGRESS_KEY,progress);useSkin();renderWallet()}
function refreshProgress(){if(storageOK){progress=readProgress();useSkin()}}
function addEnergy(n){
  S.energy+=n;refreshProgress();
  progress.balance=Math.min(Number.MAX_SAFE_INTEGER,progress.balance+n);
  progress.total=Math.min(Number.MAX_SAFE_INTEGER,progress.total+n);saveProgress();
}
function renderShop(){
  renderWallet();
  for(const card of document.querySelectorAll('.skin-card')){
    const skin=SKINS.find(s=>s.id===card.dataset.skin),owned=progress.owned.includes(skin.id),equipped=progress.selected===skin.id;
    const btn=card.querySelector('.skin-action'),short=!owned&&progress.balance<skin.price;
    card.classList.toggle('equipped',equipped);
    btn.textContent=equipped?'使用中':owned?'使用皮肤':short?'还差 '+(skin.price-progress.balance):'购买并使用';
    btn.disabled=equipped||short;btn.classList.toggle('primary',!owned&&!short);
    btn.setAttribute('aria-label',skin.name+'：'+btn.textContent);
    const ctx=card.querySelector('canvas').getContext('2d');ctx.clearRect(0,0,CW,CH);ctx.imageSmoothingEnabled=false;frame(ctx,0,0,0,skin.atlas);
  }
}
function chooseSkin(id){
  refreshProgress();const skin=SKINS.find(s=>s.id===id);if(!skin)return;
  const owned=progress.owned.includes(id);
  if(!owned&&progress.balance<skin.price){$('#shop-status').textContent='能量子不足，再去收集一些吧。';renderShop();return}
  if(progress.selected===id){renderShop();return}
  if(!owned){progress.balance-=skin.price;progress.owned.push(id)}
  progress.selected=id;saveProgress();renderShop();
  $('#shop-status').textContent=(owned?'已切换为「':'已购买并使用「')+skin.name+'」'+(storageOK?'。':'，本次进度无法保存。');
}

function generate(toX){let guard=0;

    if(gen.done){gen.x=toX;break}
    gen.v=speedAtGen();
    if(gen.script.length){gen.script.shift()();continue}
    if(gen.x>=gen.secEnd){
      if(!S.endless&&gen.sec>=3){const x=gen.x+240;ent({type:'exit',x});S.bgR=4;S.bgX=x+44;gen.done=true;break}
      gen.k++;const ns=S.endless?gen.k:gen.sec+1,x=gen.x+160;ent({type:'gate',x,sec:ns,ti:S.endless?gen.k%4:ns});
      S.bgR=S.endless?gen.k%4:ns;S.bgX=x+17;gen.sec=S.endless?0:ns;gen.x=x+34;gen.secEnd=gen.x+(S.endless?6000:TH[ns].len);gen.v=speedAtGen();gap(1.6);gen.last='';continue}
    const pi=S.endless?Math.min(gen.k,2):gen.sec,pool=POOL[pi];let tot=0;for(const[n,w]of pool)if(n!==gen.last)tot+=w;

    gen.x+=gp}
}

function bounds(e){switch(e.type){
  case'laser':return{x:e.x,y:GY-26,w:22,h:26};case'arc':return{x:e.x,y:24,w:22,h:GY-CLR-24};

function update(dt){

  if(S.hitstop>0){S.hitstop-=dt;return}
  if(S.mode==='run'&&!S.frozen){
    S.t+=dt;S.time+=dt;
    S.speed+=(targetSpeed()-S.speed)*Math.min(1,dt*2);
    updatePlayer(dt);
    if(S.mode==='run'){updateWorld(dt);checkTutorials();generate(P.x+W+500)}
  }else if(S.mode==='win'){
    S.winT+=dt;S.speed=Math.max(0,S.speed-260*dt);P.x+=S.speed*dt;P.runT+=dt;P.slide=false;
    if(!P.ground){P.vy+=G*dt;P.y+=P.vy*dt;if(P.y>=GY){P.y=GY;P.ground=true}}
    if(S.speed===0&&!S.stop&&S.winT>1.5){S.stop=true;say(['呼……出来了。地面的空气，真香。','麦克斯韦妖？让它自己在下面慢慢算熵吧。','多谢指挥！下回实验室再出事，我还找你。'],{onDone:showWin})}
  }else if(S.mode==='over'){
    const was=S.overT;S.overT+=dt;if(was<.9&&S.overT>=.9)showOver();
  }

    for(const p of world.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.life-=dt}world.parts=world.parts.filter(p=>p.life>0);
    for(const q of world.floats){q.y-=30*dt;q.life-=dt}world.floats=world.floats.filter(q=>q.life>0)}

  const tc=S.mode==='over'?W+60:S.mode==='run'?[0,PX-48,PX-74,-10][Math.max(0,S.hp)]:-40;

}

  off=-(((S.camX*.6)%768)+768)%768;const my=rr(-BT-cy*.6);for(let x=off;x<W;x+=768){g.drawImage(T.mid,rr(x),my);if(ti<4)liveProp(ti,rr(x)+320,my+BT)}

  const th=TH[ti];g.globalAlpha=.5+.1*Math.sin(S.vt*3);R(th.acc2,0,gy+52,W,14);g.globalAlpha=.25;R(th.acc2,0,gy+40,W,12);g.globalAlpha=1;

    const t0=Math.floor((a+S.camX)/32)*32-S.camX;for(let x=t0;x<b;x+=32)g.drawImage(T.tile,rr(x),gy);g.restore();
    for(const ex of[s.x0,s.x1-8]){const sx=ex-S.camX;if(!isFinite(sx)||sx<-10||sx>W)continue;for(let i=0;i<4;i++)R(i%2?'#16130a':'#ffc857',sx+i*2,gy,2,4);R('rgba(0,0,0,.45)',ex===s.x0?sx:sx+6,gy+4,2,60)}}
  g.restore();
}
function drawPlat(p){const x=rr(p.x-S.camX),y=rr(p.y-S.camY),w=rr(p.w);if(x>W||x+w<0)return;

function layout(){

  const cs=getComputedStyle(app),aw=app.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  let ah=app.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const portrait=innerHeight>innerWidth;if(touch&&portrait)ah-=$('#pad').offsetHeight+14;

  cssScale=Math.min(aw/W,ah/H);const cw=Math.floor(W*cssScale),ch=Math.floor(H*cssScale);
  stage.style.width=cw+'px';stage.style.height=ch+'px';emPx=Math.max(8.5,cw/64);stage.style.fontSize=emPx+'px';stage.classList.toggle('narrow',cw<480);
